[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datamind"
version = "0.1.0"
description = "An Interactive Machine Learning Discovery & Experimentation Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "DataMind Team" }
]
dependencies = [
    "streamlit>=1.36.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.4.0",
    "plotly>=5.18.0",
    "joblib>=1.3.0",
    "pydantic>=2.5.0",
    "filelock>=3.13.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["datamind*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:Field name .* shadows an attribute in parent:UserWarning"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
