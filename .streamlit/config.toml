[server]
address = "127.0.0.1"
port = 8501
headless = true
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 10

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#6366F1"
backgroundColor = "#0B0F19"
secondaryBackgroundColor = "#111827"
textColor = "#F9FAFB"
font = "sans serif"
baseRadius = "medium"
buttonRadius = "medium"
borderColor = "#1E293B"
showWidgetBorder = true
