backgroundColor = "#f6f7fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#172033"
font = "sans serif"
baseRadius = "medium"
buttonRadius = "medium"
borderColor = "#dde2ea"
showWidgetBorder = true
